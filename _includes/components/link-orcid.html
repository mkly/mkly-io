<li class="links" x-mkly-link-orcid>
  <a class="links--link" href="https://orcid.org/{{ site.orcid_id }}" onclick="gtag('event', 'click_orcid', {'transport_type': 'beacon'});">
    <svg class="links--icon" xmlns="http://www.w3.org/2000/svg" height="1em" viewBox="0 0 32 32" aria-hidden="true">
      <mask id="orcid-icon-cutout">
        <rect width="32" height="32" fill="white"/>
        <circle cx="9" cy="8" r="1.5" fill="black"/>
        <path d="M7.75 11h2.5v13h-2.5z M13 11h5a6.5 6.5 0 0 1 0 13h-5zm2.5 2.5v8H18a4 4 0 0 0 0-8z" fill="black" fill-rule="evenodd"/>
      </mask>
      <circle cx="16" cy="16" r="16" fill="currentColor" mask="url(#orcid-icon-cutout)"/>
    </svg>
    <span class="links--text">ORCID: {{ site.orcid_id }}</span>
  </a>
</li>
